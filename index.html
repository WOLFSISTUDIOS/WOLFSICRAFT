<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Verse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics and usability */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f0f0f0; /* Light gray track */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a78bfa; /* Purple-500 thumb */
            border-radius: 10px;
            border: 2px solid #f0f0f0; /* Padding around thumb */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #8b5cf6; /* Darker purple on hover */
        }

        /* Fade-in-up animation for modal */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fade-in-up {
            animation: fadeInScale 0.3s ease-out forwards;
        }

        /* Tailwind custom classes for common elements */
        .nav-btn {
            @apply px-3 py-2 rounded-md text-sm font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-300;
        }
        .icon-btn {
            @apply p-2 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-300;
        }
        .share-icon-btn {
            @apply p-3 rounded-full text-white shadow-lg transition-transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-opacity-75;
        }
        .list-item-btn {
            @apply w-full text-left bg-gray-50 hover:bg-gray-100 p-4 rounded-lg shadow-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-purple-300;
        }
    </style>
</head>
<body class="font-sans antialiased bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-blue-500 text-white shadow-lg py-4 px-4 sm:px-6 lg:px-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight" id="app-title">Daily Verse</h1>
            <nav class="space-x-4" aria-label="Main Navigation">
                <button id="dailyBtn" class="nav-btn transition-colors hover:text-purple-200" aria-current="page" aria-label="View daily poem">Daily</button>
                <button id="archiveBtn" class="nav-btn transition-colors hover:text-purple-200" aria-label="View poem archive">Archive</button>
                <button id="favoritesBtn" class="nav-btn transition-colors hover:text-purple-200" aria-label="View favorite poems">Favorites</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8 flex flex-col justify-center items-center">
        <!-- Daily Poem View -->
        <section id="dailyPoemView" class="w-full max-w-2xl bg-white rounded-lg shadow-xl p-6 sm:p-8 lg:p-10 text-center relative transition-all duration-500 ease-in-out" role="region" aria-labelledby="poemTitle">
            <h2 id="poemTitle" class="text-3xl sm:text-4xl font-extrabold text-purple-700 mb-4 leading-tight" aria-live="polite">Loading Poem...</h2>
            <h3 id="poemAuthor" class="text-lg sm:text-xl font-medium text-gray-600 mb-6 italic" aria-live="polite"></h3>
            <div id="poemText" class="text-base sm:text-lg leading-relaxed text-gray-700 whitespace-pre-line text-left max-h-96 overflow-y-auto custom-scrollbar" aria-live="polite"></div>

            <div class="mt-8 flex justify-center items-center space-x-4">
                <button id="favoriteBtn" class="icon-btn text-purple-500 hover:text-red-500 transition-colors duration-200" aria-label="Add to favorites">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 22.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </button>
                <button id="shareBtn" class="icon-btn text-blue-500 hover:text-blue-700 transition-colors duration-200" aria-label="Share poem">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.882 13.432 9 13.614 9 13.805v2.39c0 .191-.118.373-.316.463L6.5 17.805a1 1 0 01-1-1v-4a1 1 0 011-1l2.184-1.092zM15.316 13.342l2.184 1.092a1 1 0 011 1v4a1 1 0 01-1 1l-2.184-1.092c-.198-.09-.316-.272-.316-.463v-2.39c0-.191.118-.373.316-.463zM12 21.005L6.5 24l5.5-3v-3.5L6.5 14l5.5-3.5 5.5 3.5-5.5 3.5v3.5L12 21.005zm0-10l-5.5-3.5L12 4l5.5 3.5L12 11.005z"></path></svg>
                </button>
            </div>
            <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none" role="status" aria-live="polite"></div>

        </section>

        <!-- Archive View (initially hidden) -->
        <section id="archiveView" class="hidden w-full max-w-3xl bg-white rounded-lg shadow-xl p-6 sm:p-8 lg:p-10 transition-all duration-500 ease-in-out" aria-hidden="true" role="region" aria-labelledby="archiveTitle">
            <h2 id="archiveTitle" class="text-3xl font-extrabold text-purple-700 mb-6 text-center">Poem Archive</h2>
            <div id="archiveList" class="space-y-4">
                <p class="text-center text-gray-500 italic">Loading archive...</p>
            </div>
        </section>

        <!-- Favorites View (initially hidden) -->
        <section id="favoritesView" class="hidden w-full max-w-3xl bg-white rounded-lg shadow-xl p-6 sm:p-8 lg:p-10 transition-all duration-500 ease-in-out" aria-hidden="true" role="region" aria-labelledby="favoritesTitle">
            <h2 id="favoritesTitle" class="text-3xl font-extrabold text-red-600 mb-6 text-center">Your Favorite Poems</h2>
            <div id="favoritesList" class="space-y-4">
                <p id="noFavoritesMsg" class="text-center text-gray-500 italic">No favorite poems yet. Click the heart icon on a poem to save it!</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-200 text-gray-600 py-4 px-4 sm:px-6 lg:px-8 text-center text-sm shadow-inner mt-auto">
        <div class="container mx-auto">
            <p>&copy; 2023 Daily Verse. All rights reserved.</p>
            <div class="mt-2 space-x-4">
                <button id="increaseFontBtn" class="text-purple-600 hover:text-purple-800 transition-colors font-semibold px-2 py-1 rounded-md" aria-label="Increase font size">A+</button>
                <button id="decreaseFontBtn" class="text-purple-600 hover:text-purple-800 transition
